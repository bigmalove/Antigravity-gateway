name: Build & Test Gateway and Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test Go & Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          # GitHub runner images ship the Android SDK preinstalled. Accept
          # pending licenses so AGP can fetch anything that is missing.
          # (android-actions/setup-android@v3 is broken on current images: it
          # tries to install the removed "tools" package and fails.)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-34" "build-tools;34.0.0"; do
            if ! "$SDKMANAGER" --list_installed 2>/dev/null | grep -qF "$pkg"; then
              yes | "$SDKMANAGER" "$pkg" >/dev/null 2>&1 || true
            fi
          done
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Go Unit Tests
        run: |
          go test -v -short ./...
          go vet ./...

      - name: Run Android Lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug

      - name: Run Android Unit Tests
        working-directory: android
        run: |
          ./gradlew :app:testDebugUnitTest

      - name: Assemble Android Release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-gateway-apk
          path: android/app/build/outputs/apk/release/antigravity-gateway-*.apk
          retention-days: 14
          if-no-files-found: error
